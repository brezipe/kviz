server {
    server_name kviz.nereknu.cz;
    root /home/petr/code/kviz;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/kviz.nereknu.cz.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kviz.nereknu.cz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kviz.nereknu.cz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = kviz.nereknu.cz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name kviz.nereknu.cz;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
